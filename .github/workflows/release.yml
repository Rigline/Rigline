# Stage a release, triggered by the tag `pnpm release` pushes. Nothing here publishes anything
# installable: `pnpm stage publish` puts each version in a queue that `pnpm release:finish` then
# approves from a maintainer's machine with 2FA. See docs/releasing.md.
#
# The filename is load-bearing. Every npm trusted publisher entry names `release.yml` by path, so
# renaming this file silently breaks the OIDC exchange for all four packages until each entry is
# edited to match.
name: Release

on:
  # A pushed tag is what starts a release (D60). `pnpm release <increment>` writes it, so nothing
  # here asks for a version — and nothing asks for a dist-tag either, because `release:check`
  # derives it from the version and what the registry already holds (D61).
  push:
    tags: ["v*"]
  # Kept for dry runs, which are how the trusted publishers get checked without staging anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack, but stage nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets the runner ask GitHub for the OIDC token pnpm exchanges for a registry token.
      # Without it there is nothing to send and the publish falls back to looking for a credential
      # that this repository deliberately does not have.
      id-token: write
    steps:
      # A dispatch is for dry runs, and a dry run from a feature branch says nothing about what a
      # release would do. A tag-triggered run has no branch to check: `release:check` establishes
      # that the tag names the version in the tree, which is the stronger claim and works on any
      # maintenance line.
      - name: Refuse a dispatch from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this from main. This run is on ${{ github.ref }}."
          exit 1

      # fetch-depth 0 because a tag-triggered run is checked out at the tag, and the default
      # shallow fetch brings none of the history a version comparison reads.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned exactly rather than to the major: `v6` resolves to the last release before pnpm
      # v12 support, and `v4` runs on the node20 runner GitHub has deprecated (D59).
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before anything is built: a version the changelog does not describe, or a tag that names a
      # different one, is a release to abandon now rather than after a green run and an approval.
      # It also derives the dist-tag the two steps below stage under (D61).
      - id: check
        run: pnpm release:check

      - run: pnpm lint

      - run: pnpm typecheck

      # Before the tests, not after: the harness drives the built payload, so a test run against a
      # stale dist/ is a green result about code that is not loaded.
      - run: pnpm build

      # Tier 1 in full. The harness tier skips itself here, with a reason, because it needs a corpus
      # snapshot of the extension bundle and that lives outside the repository — so a release run is
      # a weaker check than a local one, and docs/releasing.md says to run the tests locally first.
      - run: pnpm test

      - name: Stage
        if: ${{ !inputs.dry_run }}
        run: pnpm stage publish -r --tag ${{ steps.check.outputs.dist_tag }} --provenance --report-summary --no-git-checks

      - name: Pack only
        if: ${{ inputs.dry_run }}
        run: pnpm stage publish -r --tag ${{ steps.check.outputs.dist_tag }} --dry-run --report-summary --no-git-checks

      # Nothing notifies a maintainer that a stage is waiting, and pnpm's publish output carries no
      # stage id for this to quote (the registry has one; `npm stage list` shows it). So the run
      # summary names what went up and the command that approves it, neither needing an id.
      - name: Summarise
        if: always()
        run: node .github/scripts/stage-summary.mjs "${{ inputs.dry_run && 'dry-run' || 'staged' }}"
