# Whether what npm holds is a whole release that installs (D146). Nothing in a release run can see
# that, since approval happens after it, so this looks from the outside on a schedule. Red here
# means somebody installing Rigline right now may be getting a broken set: docs/ci.md.
name: Registry

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: The published set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No install: the check needs only Node and scripts/lib.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: node .github/scripts/registry-check.mjs
