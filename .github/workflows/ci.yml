# What CI can and cannot prove — the corpus is not here, so tier 2 skips: docs/verification.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on the floor and one on the newest runtime are different bugs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.12.0 exactly: it is the `engines` floor the published packages declare, and a floor
        # is a claim rather than a sample (D59). Moving it moves six manifests with it.
        node: ["22.12.0", "24", "26"]
        # Windows at the Linux floor's own version, so one variable separates those two jobs
        # (D59). Windows at 26 is what this is developed on and needs no runner.
        include:
          - os: windows-latest
            node: "22.12.0"
    steps:
      - uses: actions/checkout@v7

      # Not `@v6`: that tag still resolves to the release before pnpm v12 support (D59).
      - uses: pnpm/action-setup@v6.1.0

      # After pnpm, never before: `cache: pnpm` asks pnpm where its store is.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Before the tests: the harness drives the built payload, so a stale dist/ is a green result
      # about code that is not loaded.
      - run: pnpm build

      - run: pnpm test
