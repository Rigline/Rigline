# A Rigline layout preset. Apply it with `rigline layout apply <file>`.
# https://github.com/Rigline/Rigline/blob/main/docs/presets.md
preset:
  description: One footer line, and no rows under the composer.

layout:
  before footerSpacer:
    - session-id/short-id
    - worktree/short-name
    - context-meter/percent
    - model-favourites/status
  off:
    - context-meter/bar
    - model-favourites/chips
    - usage-meter/cost
    - usage-meter/five-hour
    - usage-meter/seven-day
    - session-id/full-id
    - session-id/address
    - worktree/full-name
    - rigline/edit
    - rigline/reload
